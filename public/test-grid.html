<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>grid vs flex repro</title>
<style>
  body { background:#0e141b; color:#e8edf3; font-family:sans-serif; margin:0; padding:24px; }
  h2 { font-size:16px; margin:28px 0 8px; color:#f0b33a; }
  .outer { border:2px dashed #f0b33a; padding:12px; margin-bottom:8px; }
  .modal { display:flex; flex-direction:column; max-height:92dvh; background:#151d27; border:1px solid #263241; border-radius:10px; }
  .mhead { padding:12px 16px; border-bottom:1px solid #263241; flex-shrink:0; font-weight:600; }
  .sa { overflow-y:auto; min-height:0; padding:16px; display:grid; gap:12px; }
  .sb { overflow-y:auto; min-height:0; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .card { border-radius:8px; overflow:hidden; border:1px solid #263241; background:#1c2632; }
  .whead { padding:8px 12px; background:#243040; font-size:13px; font-weight:500; }
  .teams > div + div { border-top:1px solid #263241; }
  .team { padding:10px 12px; }
  .tname { font-weight:500; font-size:13.5px; }
  .row { margin-top:6px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; font-size:13px; }
  .row.gave { color:#8a99ac; }
  .lbl { font-size:12.5px; color:#8a99ac; width:64px; flex-shrink:0; }
  .chip { display:inline-flex; border:1px solid #34435a; border-radius:4px; padding:2px 7px; font-size:12px; color:#b4c0cf; white-space:nowrap; }
  .gold { color:#f0b33a; font-weight:600; }
  .note { font-size:13px; color:#8a99ac; margin:4px 0 0; }
</style></head><body>
<h2>Variant A — scroll container display:grid (current code)</h2>
<p class="note">Each card should show: week header, Team One (Received + Gave rows), Team Two (Received + Gave rows).</p>
<div class="outer"><div class="modal" style="max-height:420px">
  <div class="mhead">Trade history</div>
  <div class="sa" id="va"></div>
</div></div>
<h2>Variant B — scroll container display:flex;flex-direction:column</h2>
<div class="outer"><div class="modal" style="max-height:420px">
  <div class="mhead">Trade history</div>
  <div class="sb" id="vb"></div>
</div></div>
<script>
  const cardHTML = (week, t1, r1, g1, t2, r2, g2) => `
    <div class="card"><div class="whead">${week}</div><div class="teams">
      <div class="team"><div class="tname">${t1}</div>
        <div class="row"><span class="lbl">Received</span>${r1}</div>
        <div class="row gave"><span class="lbl">Gave</span>${g1}</div></div>
      <div class="team"><div class="tname">${t2}</div>
        <div class="row"><span class="lbl">Received</span>${r2}</div>
        <div class="row gave"><span class="lbl">Gave</span>${g2}</div></div>
    </div></div>`;
  const chips = '<span class="chip">2025 R1 via Team 10</span><span class="chip">2026 R2 via Team 3</span><span class="chip">2025 R1 via Team 6</span>';
  const html =
    cardHTML('2025 · Week 1', 'Emeka and Friends', '<span class="chip">2026 R1</span>', '<span class="gold">Justin Fields</span><span class="chip">2025 R2</span>',
      'Weston22', '<span class="chip">2025 R2 via Team 1</span>', '<span class="chip">2026 R1</span>') +
    cardHTML('2024 · Week 7', 'Waddled to the Ship', '<span class="gold">Justin Fields</span>' + chips, '<span>A.J. Brown</span><span>Jalen Hurts</span>',
      'Bishop Sycamore', '<span>A.J. Brown</span><span>Jalen Hurts</span>', '<span class="gold">Justin Fields</span>' + chips);
  document.getElementById('va').innerHTML = html;
  document.getElementById('vb').innerHTML = html;
</script>
</body></html>
